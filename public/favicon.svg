<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Outer Ripple: Slate Mist -->
  <circle
    cx="16"
    cy="16"
    r="14"
    fill="none"
    stroke="#52595C"
    stroke-width="1.5"
    stroke-opacity="0.85"
  />

  <!-- Mid Ripple: Dusk Heather -->
  <circle
    cx="16"
    cy="16"
    r="10"
    fill="none"
    stroke="#6B5E7E"
    stroke-width="1.8"
    stroke-opacity="0.95"
  />

  <!-- Inner Ripple: Quiet Sage -->
  <circle
    cx="16"
    cy="16"
    r="6.2"
    fill="none"
    stroke="#2B6B55"
    stroke-width="2.2"
  />

  <!-- Center Pebble / Droplet: Sunlit Amber -->
  <circle
    cx="16"
    cy="16"
    r="3.2"
    fill="#BD7014"
  />

  <!-- Sunlit Glint -->
  <circle
    cx="15"
    cy="15"
    r="0.85"
    fill="#FFFFFF"
    opacity="0.8"
  />
</svg>
